name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-root:
    name: Test (root)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: |
          go test \
            . \
            ./internal/... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -race

      - name: Check coverage threshold (80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 80" | bc -l)" = "1" ]; then
            echo "Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: root
          fail_ci_if_error: false

  test-core:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [fiber, mongo, redis]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true

      - name: Run tests with coverage
        run: cd ${{ matrix.module }} && go test ./... -coverprofile=coverage.out -covermode=atomic -race

      - name: Check coverage threshold (70%)
        run: |
          cd ${{ matrix.module }}
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" = "1" ]; then
            echo "Coverage ${COVERAGE}% is below the 70% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          fail_ci_if_error: false

  test-modules:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - channels/whatsapp
          - providers/anthropic
          - providers/openai
          - providers/gemini
          - providers/bedrock
          - providers/weaviate
          - providers/qdrant
          - providers/pgvector
          - providers/pinecone
          - gcp/cloudtasks
          - gcp/gcs
          - gcp/gemini
          - mcp

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true

      - name: Compute Codecov flag
        id: flag
        run: echo "name=$(echo '${{ matrix.module }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Run tests with coverage
        run: cd ${{ matrix.module }} && go test ./... -coverprofile=coverage.out -covermode=atomic -race

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ steps.flag.outputs.name }}
          fail_ci_if_error: false

  examples:
    name: Build Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: _examples/go.mod
          cache: true

      - name: Build all examples
        run: cd _examples && go build ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt violations:"
            echo "$files"
            exit 1
          fi

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Govulncheck sub-modules
        run: |
          for mod in fiber mongo redis mcp \
            channels/whatsapp \
            providers/anthropic providers/openai providers/gemini \
            providers/bedrock providers/vertexai providers/weaviate \
            providers/pgvector providers/pinecone providers/qdrant \
            gcp/cloudtasks gcp/gcs gcp/gemini; do
            echo "==> govulncheck $mod"
            (cd "$mod" && govulncheck ./...)
          done

      - name: API stability check
        run: |
          go doc -all github.com/wmulabs/eywa > /tmp/api_current.txt
          if ! diff -u .api-snapshot.txt /tmp/api_current.txt; then
            echo ""
            echo "Public API surface has changed. If this is intentional:"
            echo "  go doc -all github.com/wmulabs/eywa > .api-snapshot.txt"
            echo "  git add .api-snapshot.txt && git commit -m 'docs: update API snapshot'"
            echo ""
            echo "Review CONTRIBUTING.md to determine if this requires a MINOR or MAJOR version bump."
            exit 1
          fi

      - name: API stability check sub-modules
        run: |
          for mod in fiber mongo redis mcp; do
            echo "==> API snapshot check: $mod"
            (cd "$mod" && go doc -all .) > /tmp/api_current_${mod}.txt
            if ! diff -u ".api-snapshots/${mod}.txt" "/tmp/api_current_${mod}.txt"; then
              echo ""
              echo "Public API surface of '$mod' has changed. If this is intentional:"
              echo "  (cd $mod && go doc -all .) > .api-snapshots/${mod}.txt"
              echo "  git add .api-snapshots/${mod}.txt && git commit -m 'docs: update $mod API snapshot'"
              echo ""
              echo "Review CONTRIBUTING.md to determine if this requires a MINOR or MAJOR version bump."
              exit 1
            fi
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-root, test-core, test-modules]
    if: always()
    steps:
      - name: All tests passed
        run: |
          if [[ "${{ needs.test-root.result }}"    != "success" || \
                "${{ needs.test-core.result }}"    != "success" || \
                "${{ needs.test-modules.result }}" != "success" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Lint sub-modules
        run: |
          SUBMODULES="channels/whatsapp fiber gcp/cloudtasks gcp/gcs gcp/gemini mcp mongo providers/anthropic providers/bedrock providers/gemini providers/openai providers/pgvector providers/pinecone providers/qdrant providers/vertexai providers/weaviate redis"
          for mod in $SUBMODULES; do
            echo "=== Linting $mod ==="
            (cd "$mod" && golangci-lint run ./... --timeout 5m) || exit 1
          done
