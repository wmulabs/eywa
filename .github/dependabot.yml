version: 2

updates:
  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # All Go modules (root + sub-modules) in one config via directories.
  # Minor/patch updates are grouped into a single PR per directory; majors get
  # their own PRs for individual review. chore(deps) keeps bumps non-releasing.
  - package-ecosystem: gomod
    directories:
      - /
      - /_examples
      - /fiber
      - /mongo
      - /redis
      - /mcp
      - /channels/whatsapp
      - /providers/anthropic
      - /providers/openai
      - /providers/gemini
      - /providers/ollama
      - /providers/bedrock
      - /providers/weaviate
      - /providers/qdrant
      - /providers/pgvector
      - /providers/pinecone
      - /providers/vertexai
      - /observability/langfuse
      - /gcp/cloudtasks
      - /gcp/gcs
      - /gcp/gemini
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
